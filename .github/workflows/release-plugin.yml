name: Validate or sign plugin candidate

# Signing only verifies keys or signs an independently checked existing draft.
# The token is read-only: this workflow cannot publish Releases or Marketplace.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build unsigned bytes, verify both publisher keys, or sign an existing draft
        type: choice
        default: build
        options: [build, verify-keys, sign-draft]
      draft_tag:
        description: Existing draft tag, pinned to this exact source commit (sign-draft only)
        type: string
      archive_sha256:
        description: Independently reviewed archive SHA256, without prefix (sign-draft only)
        type: string
      plugin:
        description: Independently validate this plugin; only synthetic fixture artifacts are uploaded
        required: true
        default: fixture-engineering
        type: choice
        options: [fixture-engineering, dlubal-rfem, rhino]

permissions:
  contents: read

jobs:
  candidate:
    if: inputs.operation == 'build'
    name: Candidate / ${{ inputs.plugin }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve one complete independent project
        id: project
        shell: pwsh
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
        run: |
          if ($env:PLUGIN_ID -eq 'fixture-engineering') {
            $root = 'tests/fixtures/fixture-engineering'
          } elseif ($env:PLUGIN_ID -in @('dlubal-rfem', 'rhino')) {
            $root = "plugins/$env:PLUGIN_ID"
          } else { throw 'Unknown plugin' }
          $project = "$root/provider"
          $hasProject = Test-Path -LiteralPath "$project/pyproject.toml"
          $hasLock = Test-Path -LiteralPath "$project/uv.lock"
          if (-not $hasProject -or -not $hasLock) { throw 'Selected Provider project is incomplete; candidate build refused' }
          "root=$root" >> $env:GITHUB_OUTPUT
          "project=$project" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.21'
          enable-cache: false
      - name: Verify selected root and frozen Provider versions agree
        working-directory: ${{ steps.project.outputs.project }}
        shell: pwsh
        run: |
          python -B -c "import json,tomllib; from pathlib import Path; root=json.loads(Path('../plugin.json').read_bytes()); project=tomllib.loads(Path('pyproject.toml').read_text('utf-8'))['project']; assert root['version']==project['version']; print('candidate root version='+root['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: inputs.plugin == 'rhino'
        with:
          global-json-file: plugins/rhino/global.json
      - name: Build the owned Rhino Bridge before provider interoperability tests
        if: inputs.plugin == 'rhino'
        working-directory: plugins/rhino
        shell: pwsh
        run: |
          dotnet build native/RhinoMcpBridge.csproj -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test native/tests/RhinoMcpBridge.Tests.csproj -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synchronize only the selected Provider's frozen test environment
        working-directory: ${{ steps.project.outputs.project }}
        shell: pwsh
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
        run: |
          $syncArgs = @('sync', '--frozen', '--extra', 'test')
          if ($env:PLUGIN_ID -eq 'fixture-engineering') { $syncArgs += @('--extra', 'build') }
          $syncArgs += @('--python', (Get-Command python).Source)
          uv @syncArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the selected Provider suite without supplying engineering credentials
        working-directory: ${{ steps.project.outputs.project }}
        shell: pwsh
        env:
          NATIVE_REPRODUCIBILITY_CHECK: ${{ inputs.plugin == 'rhino' && '1' || '0' }}
        run: |
          uv run --frozen --extra test python -B -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and independently verify the unsigned candidate
        shell: pwsh
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
          PLUGIN_ROOT: ${{ steps.project.outputs.root }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'plugin-candidate'
          if (Test-Path -LiteralPath $output) { throw 'Candidate output path must be fresh' }
          if ($env:PLUGIN_ID -eq 'fixture-engineering') {
            $sequence = 1
          } else {
            $releaseInputDoc = Get-Content -Raw -LiteralPath (Join-Path $env:PLUGIN_ROOT 'packaging/release-input.json') | ConvertFrom-Json
            $sequence = [int]$releaseInputDoc.releaseIdentity.releaseSequence
          }
          python -B scripts/build_artifact.py $env:PLUGIN_ROOT --release-sequence $sequence --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem -LiteralPath $output -File -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Candidate build must produce exactly one archive' }
          $receipt = Join-Path $output 'unsigned-receipt.json'
          $providerPython = Join-Path $env:PLUGIN_ROOT 'provider/.venv/Scripts/python.exe'
          $verification = & $providerPython -B scripts/verify_artifact.py $archives[0].FullName $receipt schemas --unsigned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verified = ($verification -join "`n") | ConvertFrom-Json
          $release = Get-Content -Raw -LiteralPath (Join-Path $output 'artifact/release.json') | ConvertFrom-Json
          "Candidate: $($release.packageId) $($release.pluginVersion), sequence $($release.releaseSequence), $($verified.archiveDigest), $($archives[0].Length) bytes. Verification mode: unsigned candidate only; no signer trust or Stable claim." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload safe synthetic fixture evidence only
        if: success() && inputs.plugin == 'fixture-engineering'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-fixture-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/plugin-candidate
          if-no-files-found: error
          retention-days: 3

  signing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation != 'build'
    environment: plugin-signing
    runs-on: windows-2025
    timeout-minutes: 20
    concurrency:
      group: plugin-signing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.21'
          enable-cache: false
      - name: Prepare only the existing independent signing tool environment
        working-directory: tests/fixtures/fixture-engineering/provider
        shell: pwsh
        run: |
          uv sync --frozen --extra test --extra build --python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read exact existing draft assets before accessing signing secrets
        if: inputs.operation == 'sign-draft'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          PLUGIN_ID: ${{ inputs.plugin }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if ($env:PLUGIN_ID -notin @('dlubal-rfem', 'rhino') -or $env:ARCHIVE_SHA256 -cnotmatch '^[a-f0-9]{64}$') { throw 'Invalid signing request' }
          $root = Get-Content -Raw -LiteralPath "plugins/$env:PLUGIN_ID/plugin.json" | ConvertFrom-Json
          if ($env:DRAFT_TAG -cne "plugin-$($env:PLUGIN_ID)-v$($root.version)") { throw 'Draft identity mismatch' }
          $raw = gh api "repos/XIAOYUGAN666/opendesign-plugins/releases/tags/$env:DRAFT_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $raw | ConvertFrom-Json
          if ($release.draft -ne $true -or $release.target_commitish -cne $env:SOURCE_COMMIT) { throw 'Exact-commit draft required' }
          $tags = @(git ls-remote --tags origin "refs/tags/$env:DRAFT_TAG" "refs/tags/$env:DRAFT_TAG^{}")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tags.Count -gt 0 -and ($tags[-1] -split '\s+')[0] -cne $env:SOURCE_COMMIT) { throw 'Existing immutable tag targets another commit' }
          $archives = @($release.assets | Where-Object { $_.name -cmatch '^[A-Za-z0-9._-]+\.zip$' })
          $receipts = @($release.assets | Where-Object { $_.name -ceq 'unsigned-receipt.json' })
          if ($archives.Count -ne 1 -or $receipts.Count -ne 1 -or $archives[0].size -gt 1073741824 -or $receipts[0].size -gt 1048576) { throw 'Ambiguous or oversized draft assets' }
          $candidate = Join-Path $env:RUNNER_TEMP 'signing-candidate'
          New-Item -ItemType Directory -Path $candidate -ErrorAction Stop | Out-Null
          gh release download $env:DRAFT_TAG --repo XIAOYUGAN666/opendesign-plugins --pattern $archives[0].name --pattern 'unsigned-receipt.json' --dir $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $candidate $archives[0].name
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:ARCHIVE_SHA256) { throw 'Draft archive mismatch' }
          @{ packageId=$env:PLUGIN_ID; version=$root.version; draft=$release.draft; tag=$release.tag_name; sourceCommit=$env:SOURCE_COMMIT; targetCommit=$release.target_commitish; assetUrl=$archives[0].browser_download_url; archiveDigest="sha256:$env:ARCHIVE_SHA256" } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM -LiteralPath (Join-Path $candidate 'context.json')
      - name: Match private keys to the unchanged Host public policy and optionally sign
        shell: pwsh
        env:
          RFEM_PUBLISHER_V1_KEY_B64: ${{ secrets.RFEM_PUBLISHER_V1_KEY_B64 }}
          RHINO_PUBLISHER_V1_KEY_B64: ${{ secrets.RHINO_PUBLISHER_V1_KEY_B64 }}
          SIGNING_OPERATION: ${{ inputs.operation }}
        run: |
          $tool = 'tests/fixtures/fixture-engineering/provider/.venv/Scripts/python.exe'
          $arguments = @('-B', 'scripts/publisher_signing.py', '--schemas', 'schemas')
          if ($env:SIGNING_OPERATION -eq 'sign-draft') {
            $candidate = Join-Path $env:RUNNER_TEMP 'signing-candidate'
            $archive = @(Get-ChildItem -LiteralPath $candidate -File -Filter '*.zip')
            if ($archive.Count -ne 1) { throw 'Missing draft archive' }
            $arguments += @('--archive', $archive[0].FullName, '--candidate', (Join-Path $candidate 'unsigned-receipt.json'), '--context', (Join-Path $candidate 'context.json'), '--output', (Join-Path $candidate 'signed-receipt.json'))
          }
          $report = & $tool @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report >> $env:GITHUB_STEP_SUMMARY
      - name: Confirm candidate is still a draft before retaining its signature
        if: success() && inputs.operation == 'sign-draft'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $raw = gh api "repos/XIAOYUGAN666/opendesign-plugins/releases/tags/$env:DRAFT_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $raw | ConvertFrom-Json
          if ($release.draft -ne $true -or $release.target_commitish -cne $env:SOURCE_COMMIT) { throw 'Candidate is no longer the reviewed draft' }
      - name: Retain public candidate signature metadata only
        if: success() && inputs.operation == 'sign-draft'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-draft-receipt-${{ inputs.plugin }}-${{ github.sha }}
          path: ${{ runner.temp }}/signing-candidate/signed-receipt.json
          if-no-files-found: error
          retention-days: 3
