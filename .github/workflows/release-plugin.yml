name: Validate or sign plugin candidate

# Signing only verifies keys or signs an independently checked existing draft.
# GitHub draft visibility requires push access. Only the signing job receives
# contents:write; token use is confined to release-list/download GET operations.
# This workflow contains no Release/tag/Marketplace publication operation.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build unsigned bytes, verify both publisher keys, or sign an existing draft
        type: choice
        default: build
        options: [build, verify-keys, sign-draft, sign-market-candidate, sign-market-update]
      draft_tag:
        description: Existing draft tag, pinned to this exact source commit (sign-draft only)
        type: string
      archive_sha256:
        description: Reviewed archive SHA256; selected plugin for sign-draft or sign-market-update, RFEM for initial market
        type: string
      rhino_archive_sha256:
        description: Reviewed Rhino archive SHA256 (sign-market-candidate only)
        type: string
      previous_market_sha256:
        description: Reviewed current signed snapshot SHA256 (sign-market-update only)
        type: string
      plugin:
        description: Independently validate this plugin; only synthetic fixture artifacts are uploaded
        required: true
        default: fixture-engineering
        type: choice
        options: [fixture-engineering, dlubal-rfem, rhino]

permissions:
  contents: read

jobs:
  candidate:
    if: inputs.operation == 'build'
    name: Candidate / ${{ inputs.plugin }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve one complete independent project
        id: project
        shell: pwsh
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
        run: |
          if ($env:PLUGIN_ID -eq 'fixture-engineering') {
            $root = 'tests/fixtures/fixture-engineering'
          } elseif ($env:PLUGIN_ID -in @('dlubal-rfem', 'rhino')) {
            $root = "plugins/$env:PLUGIN_ID"
          } else { throw 'Unknown plugin' }
          $project = "$root/provider"
          $hasProject = Test-Path -LiteralPath "$project/pyproject.toml"
          $hasLock = Test-Path -LiteralPath "$project/uv.lock"
          if (-not $hasProject -or -not $hasLock) { throw 'Selected Provider project is incomplete; candidate build refused' }
          "root=$root" >> $env:GITHUB_OUTPUT
          "project=$project" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.21'
          enable-cache: false
      - name: Verify selected root and frozen Provider versions agree
        working-directory: ${{ steps.project.outputs.project }}
        shell: pwsh
        run: |
          python -B -c "import json,tomllib; from pathlib import Path; root=json.loads(Path('../plugin.json').read_bytes()); project=tomllib.loads(Path('pyproject.toml').read_text('utf-8'))['project']; assert root['version']==project['version']; print('candidate root version='+root['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: inputs.plugin == 'rhino'
        with:
          global-json-file: plugins/rhino/global.json
      - name: Build the owned Rhino Bridge before provider interoperability tests
        if: inputs.plugin == 'rhino'
        working-directory: plugins/rhino
        shell: pwsh
        run: |
          dotnet build native/RhinoMcpBridge.csproj -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test native/tests/RhinoMcpBridge.Tests.csproj -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synchronize only the selected Provider's frozen test environment
        working-directory: ${{ steps.project.outputs.project }}
        shell: pwsh
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
        run: |
          $syncArgs = @('sync', '--frozen', '--extra', 'test')
          if ($env:PLUGIN_ID -eq 'fixture-engineering') { $syncArgs += @('--extra', 'build') }
          $syncArgs += @('--python', (Get-Command python).Source)
          uv @syncArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the selected Provider suite without supplying engineering credentials
        working-directory: ${{ steps.project.outputs.project }}
        shell: pwsh
        env:
          NATIVE_REPRODUCIBILITY_CHECK: ${{ inputs.plugin == 'rhino' && '1' || '0' }}
        run: |
          uv run --frozen --extra test python -B -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and independently verify the unsigned candidate
        shell: pwsh
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
          PLUGIN_ROOT: ${{ steps.project.outputs.root }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'plugin-candidate'
          if (Test-Path -LiteralPath $output) { throw 'Candidate output path must be fresh' }
          if ($env:PLUGIN_ID -eq 'fixture-engineering') {
            $sequence = 1
          } else {
            $releaseInputDoc = Get-Content -Raw -LiteralPath (Join-Path $env:PLUGIN_ROOT 'packaging/release-input.json') | ConvertFrom-Json
            $sequence = [int]$releaseInputDoc.releaseIdentity.releaseSequence
          }
          python -B scripts/build_artifact.py $env:PLUGIN_ROOT --release-sequence $sequence --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem -LiteralPath $output -File -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Candidate build must produce exactly one archive' }
          $receipt = Join-Path $output 'unsigned-receipt.json'
          $providerPython = Join-Path $env:PLUGIN_ROOT 'provider/.venv/Scripts/python.exe'
          $verification = & $providerPython -B scripts/verify_artifact.py $archives[0].FullName $receipt schemas --unsigned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verified = ($verification -join "`n") | ConvertFrom-Json
          $release = Get-Content -Raw -LiteralPath (Join-Path $output 'artifact/release.json') | ConvertFrom-Json
          "Candidate: $($release.packageId) $($release.pluginVersion), sequence $($release.releaseSequence), $($verified.archiveDigest), $($archives[0].Length) bytes. Verification mode: unsigned candidate only; no signer trust or Stable claim." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload safe synthetic fixture evidence only
        if: success() && inputs.plugin == 'fixture-engineering'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-fixture-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/plugin-candidate
          if-no-files-found: error
          retention-days: 3

  signing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation != 'build'
    environment: plugin-signing
    # Drafts are invisible to contents:read (GitHub REST releases contract).
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 20
    concurrency:
      group: plugin-signing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.21'
          enable-cache: false
      - name: Prepare only the existing independent signing tool environment
        working-directory: tests/fixtures/fixture-engineering/provider
        shell: pwsh
        run: |
          uv sync --frozen --extra test --extra build --python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read exact existing draft assets before accessing signing secrets
        if: inputs.operation == 'sign-draft' || inputs.operation == 'sign-market-candidate' || inputs.operation == 'sign-market-update'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_OPERATION: ${{ inputs.operation }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          RHINO_ARCHIVE_SHA256: ${{ inputs.rhino_archive_sha256 }}
          PLUGIN_ID: ${{ inputs.plugin }}
          SOURCE_COMMIT: ${{ github.sha }}
          PREVIOUS_MARKET_SHA256: ${{ inputs.previous_market_sha256 }}
        run: |
          $marketReview = $env:SIGNING_OPERATION -in @('sign-market-candidate', 'sign-market-update')
          $packages = if ($env:SIGNING_OPERATION -eq 'sign-market-candidate') { @('dlubal-rfem', 'rhino') } else { @($env:PLUGIN_ID) }
          $raw = gh api 'repos/XIAOYUGAN666/opendesign-plugins/releases?per_page=100'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $allReleases = $raw | ConvertFrom-Json
          $candidate = Join-Path $env:RUNNER_TEMP 'signing-candidate'
          New-Item -ItemType Directory -Path $candidate -ErrorAction Stop | Out-Null
          $entries = @()
          foreach ($package in $packages) {
            $expectedSha = if ($env:SIGNING_OPERATION -eq 'sign-market-candidate' -and $package -eq 'rhino') { $env:RHINO_ARCHIVE_SHA256 } else { $env:ARCHIVE_SHA256 }
            if ($package -notin @('dlubal-rfem', 'rhino') -or $expectedSha -cnotmatch '^[a-f0-9]{64}$') { throw 'Invalid signing request' }
            $root = Get-Content -Raw -LiteralPath "plugins/$package/plugin.json" | ConvertFrom-Json
            $expectedTag = "plugin-$($package)-v$($root.version)"
            if (-not $marketReview -and $env:DRAFT_TAG -cne $expectedTag) { throw 'Draft identity mismatch' }
            $drafts = @($allReleases | Where-Object { $_.tag_name -ceq $expectedTag })
            if ($drafts.Count -ne 1) { throw 'Exact draft was not found' }
            $release = $drafts[0]
            if ($release.draft -ne $true -or $release.target_commitish -cne $env:SOURCE_COMMIT) { throw 'Exact-commit draft required' }
            $tags = @(git ls-remote --tags origin "refs/tags/$expectedTag" "refs/tags/$expectedTag^{}")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($tags.Count -gt 0 -and ($tags[-1] -split '\s+')[0] -cne $env:SOURCE_COMMIT) { throw 'Existing immutable tag targets another commit' }
            $receiptName = if ($marketReview) { 'signed-receipt.json' } else { 'unsigned-receipt.json' }
            $archives = @($release.assets | Where-Object { $_.name -cmatch '^[A-Za-z0-9._-]+\.zip$' })
            $receipts = @($release.assets | Where-Object { $_.name -ceq $receiptName })
            if ($archives.Count -ne 1 -or $receipts.Count -ne 1 -or $archives[0].size -gt 1073741824 -or $receipts[0].size -gt 1048576) { throw 'Ambiguous or oversized draft assets' }
            $directory = Join-Path $candidate $package
            New-Item -ItemType Directory -Path $directory -ErrorAction Stop | Out-Null
            gh release download $expectedTag --repo XIAOYUGAN666/opendesign-plugins --pattern $archives[0].name --pattern $receiptName --dir $directory
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $archive = Join-Path $directory $archives[0].name
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedSha) { throw 'Draft archive mismatch' }
            # Draft browser URLs are temporary; bind only the confirmed tag's intended final URL.
            $publicationUrl = "https://github.com/XIAOYUGAN666/opendesign-plugins/releases/download/$($release.tag_name)/$($archives[0].name)"
            $context = @{ packageId=$package; version=$root.version; draft=$release.draft; tag=$release.tag_name; sourceCommit=$env:SOURCE_COMMIT; targetCommit=$release.target_commitish; assetUrl=$publicationUrl; archiveDigest="sha256:$expectedSha" }
            $context | ConvertTo-Json | Set-Content -Encoding utf8NoBOM -LiteralPath (Join-Path $directory 'context.json')
            $entries += @{archive=$archive; receipt=(Join-Path $directory $receiptName); context=$context}
          }
          if ($env:SIGNING_OPERATION -eq 'sign-market-update') {
            if ($env:PREVIOUS_MARKET_SHA256 -cnotmatch '^[a-f0-9]{64}$' -or (Get-FileHash '.agents/plugins/marketplace.snapshot.json' -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:PREVIOUS_MARKET_SHA256) { throw 'Previous market mismatch' }
            $snapshot = Get-Content -Raw '.agents/plugins/marketplace.snapshot.json' | ConvertFrom-Json
            foreach ($receipt in @($snapshot.releases) + @($snapshot.skillReleases)) {
              if ($null -eq $receipt -or $receipt.revoked) { throw 'Invalid previous receipt' }
              $old = $receipt.release
              if ($old.packageId -ceq $env:PLUGIN_ID) { continue }
              $oldTag = "plugin-$($old.packageId)-v$($old.pluginVersion)"
              $public = @($allReleases | Where-Object { $_.tag_name -ceq $oldTag -and $_.draft -eq $false -and $_.prerelease -eq $false })
              if ($public.Count -ne 1) { throw 'Previously published release missing' }
              $name = [IO.Path]::GetFileName(([uri]$receipt.archive.url).AbsolutePath)
              if ($name -cnotmatch '^[A-Za-z0-9._-]+\.zip$' -or @($public[0].assets | Where-Object { $_.name -ceq $name -and $_.size -eq $receipt.archive.byteLength }).Count -ne 1) { throw 'Previous asset mismatch' }
              $directory = Join-Path $candidate $old.packageId
              New-Item -ItemType Directory -Path $directory -ErrorAction Stop | Out-Null
              gh release download $oldTag --repo XIAOYUGAN666/opendesign-plugins --pattern $name --dir $directory
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $oldArchive = Join-Path $directory $name
              if ("sha256:$((Get-FileHash -LiteralPath $oldArchive -Algorithm SHA256).Hash.ToLowerInvariant())" -cne $receipt.archive.sha256) { throw 'Previous archive digest mismatch' }
              $oldReceipt = Join-Path $directory 'signed-receipt.json'
              ConvertTo-Json -InputObject $receipt -Depth 100 -Compress | Set-Content -Encoding utf8NoBOM $oldReceipt
              $oldContext = @{published=$true; packageId=$old.packageId; version=$old.pluginVersion; tag=$oldTag; assetUrl=$receipt.archive.url; archiveDigest=$receipt.archive.sha256}
              $entries += @{archive=$oldArchive; receipt=$oldReceipt; context=$oldContext}
            }
          }
          ConvertTo-Json -InputObject @($entries) -Depth 10 | Set-Content -Encoding utf8NoBOM -LiteralPath (Join-Path $candidate 'market-inputs.json')
      - name: Match private keys to the exported Host public policy and optionally sign
        shell: pwsh
        env:
          RFEM_PUBLISHER_V1_KEY_B64: ${{ secrets.RFEM_PUBLISHER_V1_KEY_B64 }}
          RHINO_PUBLISHER_V1_KEY_B64: ${{ secrets.RHINO_PUBLISHER_V1_KEY_B64 }}
          SIGNING_OPERATION: ${{ inputs.operation }}
          SOURCE_COMMIT: ${{ github.sha }}
          PLUGIN_ID: ${{ inputs.plugin }}
          PREVIOUS_MARKET_SHA256: ${{ inputs.previous_market_sha256 }}
        run: |
          $tool = 'tests/fixtures/fixture-engineering/provider/.venv/Scripts/python.exe'
          $arguments = @('-B', 'scripts/publisher_signing.py', '--schemas', 'schemas')
          if ($env:SIGNING_OPERATION -eq 'sign-draft') {
            $candidate = Join-Path (Join-Path $env:RUNNER_TEMP 'signing-candidate') $env:PLUGIN_ID
            $archive = @(Get-ChildItem -LiteralPath $candidate -File -Filter '*.zip')
            if ($archive.Count -ne 1) { throw 'Missing draft archive' }
            $arguments += @('--archive', $archive[0].FullName, '--candidate', (Join-Path $candidate 'unsigned-receipt.json'), '--context', (Join-Path $candidate 'context.json'), '--output', (Join-Path $candidate 'signed-receipt.json'))
          }
          if ($env:SIGNING_OPERATION -in @('sign-market-candidate', 'sign-market-update')) {
            $candidate = Join-Path $env:RUNNER_TEMP 'signing-candidate'
            $arguments += @('--market-inputs', (Join-Path $candidate 'market-inputs.json'), '--source-commit', $env:SOURCE_COMMIT, '--output', (Join-Path $candidate 'market-review'))
            if ($env:SIGNING_OPERATION -eq 'sign-market-update') {
              if ($env:PREVIOUS_MARKET_SHA256 -cnotmatch '^[a-f0-9]{64}$') { throw 'Previous market digest required' }
              $arguments += @('--previous-market-digest', "sha256:$env:PREVIOUS_MARKET_SHA256")
            }
          }
          $report = & $tool @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report >> $env:GITHUB_STEP_SUMMARY
      - name: Confirm candidate is still a draft before retaining its signature
        if: success() && (inputs.operation == 'sign-draft' || inputs.operation == 'sign-market-candidate' || inputs.operation == 'sign-market-update')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
          SIGNING_OPERATION: ${{ inputs.operation }}
          SOURCE_COMMIT: ${{ github.sha }}
          PLUGIN_ID: ${{ inputs.plugin }}
        run: |
          $raw = gh api 'repos/XIAOYUGAN666/opendesign-plugins/releases?per_page=100'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $allReleases = $raw | ConvertFrom-Json
          $tags = if ($env:SIGNING_OPERATION -eq 'sign-market-candidate') {
            @('dlubal-rfem','rhino') | ForEach-Object { $root = Get-Content -Raw "plugins/$_/plugin.json" | ConvertFrom-Json; "plugin-$($_)-v$($root.version)" }
          } elseif ($env:SIGNING_OPERATION -eq 'sign-market-update') {
            $root = Get-Content -Raw "plugins/$env:PLUGIN_ID/plugin.json" | ConvertFrom-Json
            @("plugin-$($env:PLUGIN_ID)-v$($root.version)")
          } else { @($env:DRAFT_TAG) }
          foreach ($tag in $tags) {
            $drafts = @($allReleases | Where-Object { $_.tag_name -ceq $tag })
            if ($drafts.Count -ne 1) { throw 'Exact draft was not found' }
            if ($drafts[0].draft -ne $true -or $drafts[0].target_commitish -cne $env:SOURCE_COMMIT) { throw 'Candidate is no longer the reviewed draft' }
          }
      - name: Retain public candidate signature metadata only
        if: success() && inputs.operation == 'sign-draft'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-draft-receipt-${{ inputs.plugin }}-${{ github.sha }}
          path: ${{ runner.temp }}/signing-candidate/${{ inputs.plugin }}/signed-receipt.json
          if-no-files-found: error
          retention-days: 3
      - name: Retain isolated market review metadata only
        if: success() && (inputs.operation == 'sign-market-candidate' || inputs.operation == 'sign-market-update')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: market-review-${{ github.sha }}
          path: ${{ runner.temp }}/signing-candidate/market-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
