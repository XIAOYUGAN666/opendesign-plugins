name: Verify independent plugin projects

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Root contracts and artifact bindings
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.21'
          enable-cache: false
      - name: Prepare only the fixture's independent tool environment
        working-directory: tests/fixtures/fixture-engineering/provider
        shell: pwsh
        run: |
          uv sync --frozen --extra test --extra build --python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify root source, trust, generated discovery and extracted artifacts
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  fixture:
    name: Independent synthetic Windows fixture
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.21'
          enable-cache: false
      - name: Test its own frozen lock
        working-directory: tests/fixtures/fixture-engineering/provider
        shell: pwsh
        run: |
          uv sync --frozen --extra test --extra build --python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen --extra test python -B -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  provider:
    name: Independent provider / ${{ matrix.plugin }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin: [dlubal-rfem, rhino]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report project availability explicitly
        id: project
        shell: pwsh
        env:
          PLUGIN_ID: ${{ matrix.plugin }}
        run: |
          $project = Join-Path 'plugins' "$env:PLUGIN_ID/provider"
          $hasProject = Test-Path -LiteralPath (Join-Path $project 'pyproject.toml')
          $hasLock = Test-Path -LiteralPath (Join-Path $project 'uv.lock')
          if ($hasProject -ne $hasLock) { throw 'Incomplete independent Provider project' }
          if ($hasProject) {
            'present=true' >> $env:GITHUB_OUTPUT
          } else {
            'present=false' >> $env:GITHUB_OUTPUT
            "$env:PLUGIN_ID=notPresent (Provider has not migrated; no Provider test/build PASS claim)" >> $env:GITHUB_STEP_SUMMARY
            Write-Output "$env:PLUGIN_ID=notPresent"
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.project.outputs.present == 'true'
        with:
          python-version: '3.12.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.project.outputs.present == 'true'
        with:
          version: '0.9.21'
          enable-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.project.outputs.present == 'true' && matrix.plugin == 'rhino'
        with:
          dotnet-version: '8.0.x'
      - name: Build and test the owned native Bridge before process interoperability
        if: steps.project.outputs.present == 'true' && matrix.plugin == 'rhino'
        working-directory: plugins/${{ matrix.plugin }}
        shell: pwsh
        run: |
          dotnet test native/tests/RhinoMcpBridge.Tests.csproj -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the selected Provider's own lock and environment
        if: steps.project.outputs.present == 'true'
        working-directory: plugins/${{ matrix.plugin }}/provider
        shell: pwsh
        run: |
          uv sync --frozen --extra test --python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen --extra test python -B -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
