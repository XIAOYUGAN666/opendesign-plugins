[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dlubal-rfem-mcp"
version = "0.2.4"
description = "Independent RFEM-only MCP Connector for a managed desktop host"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=2.13.0.2,<3",
    "pydantic>=2.11.7,<3",
    "pydantic-settings>=2.0,<3",
    "uvicorn[standard]>=0.30",
    "starlette>=0.40",
    "jsonschema>=4.23,<5",
    "httpx>=0.28,<1",
    "packaging>=24",
    "pywin32>=307; sys_platform == 'win32'",
]

[project.optional-dependencies]
sdk-test = ["dlubal.api==2.16.5"]
test = [
    "dlubal-rfem-mcp[sdk-test]",
    "cryptography==50.0.1",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
dlubal-rfem-mcp = "dlubal_mcp.plugin_stdio:main"

[tool.hatch.build.targets.wheel]
packages = ["dlubal_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_rfem: opt-in test against a licensed local RFEM instance",
]

[tool.ruff]
target-version = "py312"

# Keep the one-time official source as published.
[tool.ruff.lint.per-file-ignores]
"dlubal_mcp/core/introspection/index.py" = ["BLE001", "F401", "FURB188", "RUF100", "S112"]
"dlubal_mcp/core/introspection/render.py" = ["ISC004"]
"dlubal_mcp/core/logging_config.py" = ["UP017"]
"dlubal_mcp/rfem/results.py" = ["BLE001", "C401", "SIM102"]
"dlubal_mcp/rfem/state_fingerprint.py" = ["I001", "UP012"]
"tests/test_rpc_deadline.py" = ["S102"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
